<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Alumnos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Registro de Alumnos</h1>

    <section class="card">
      <h2>Nuevo alumno</h2>
      <form id="form">
        <input name="matricula" placeholder="Matrícula" required />
        <input name="nombre" placeholder="Nombre completo" required />
        <input name="correo" type="email" placeholder="Correo" required />
        <input name="carrera" placeholder="Carrera" required />
        <button type="submit">Registrar</button>
      </form>
      <p id="msg" role="alert"></p>
    </section>

    <section class="card">
      <h2>Alumnos registrados</h2>
      <input id="search" placeholder="Buscar por nombre, matrícula o carrera..." />
      <table>
        <thead>
          <tr><th>Matrícula</th><th>Nombre</th><th>Correo</th><th>Carrera</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
